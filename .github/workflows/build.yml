name: Build Executables — MASV Multiplatform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            asset_name: MASV-Linux
          - os: windows-latest
            asset_name: MASV-Windows.exe
          - os: macos-latest
            asset_name: MASV-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray Pillow

      - name: Download Portable scrcpy for Windows (1-Click Standalone Bundle)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path bin
          curl.exe -L -o scrcpy-win64.zip https://github.com/Genymobile/scrcpy/releases/download/v2.4/scrcpy-win64-v2.4.zip
          Expand-Archive -Path scrcpy-win64.zip -DestinationPath scrcpy_temp -Force
          Get-ChildItem -Path scrcpy_temp\scrcpy-win64-v2.4\* | Move-Item -Destination bin\ -Force
          Remove-Item -Recurse -Force scrcpy_temp -ErrorAction SilentlyContinue
          Remove-Item -Force scrcpy-win64.zip -ErrorAction SilentlyContinue

      - name: Build Executable
        env:
          PYTHONIOENCODING: 'utf-8'
        run: python build.py

      - name: Prepare release artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p bin_release
          if [ -f dist/MASV-Linux.tar.gz ]; then
            cp dist/MASV-Linux.tar.gz bin_release/MASV-Linux.tar.gz
          elif [ -f MASV-Linux.tar.gz ]; then
            cp MASV-Linux.tar.gz bin_release/MASV-Linux.tar.gz
          else
            tar -czvf bin_release/MASV-Linux.tar.gz -C dist MASV
          fi

      - name: Prepare release artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin_release
          if [ -f dist/MASV.exe ]; then
            cp dist/MASV.exe bin_release/MASV-Windows.exe
          elif [ -f dist/MASV ]; then
            cp dist/MASV bin_release/MASV-Windows.exe
          fi

      - name: Prepare release artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p bin_release
          cp dist/MASV bin_release/MASV-macOS

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: bin_release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin_release/*
          body: |
            ## MASV — Memexicanisimos Android Screen Viewer ${{ github.ref_name }}

            ### 🚀 Descargas Directas Listo para Usar (1-Clic)

            | Sistema | Archivo | Detalles |
            |---------|---------|----------|
            | 🪟 **Windows** | `MASV-Windows.exe` | **100% Standalone (Incluye scrcpy y adb integrados en el ejecutable, cero instalación previa)** |
            | 🐧 **Linux** | `MASV-Linux.tar.gz` | Paquete ejecutable para distros Debian/Ubuntu/Arch/Fedora |
            | 🍎 **macOS** | `MASV-macOS` | Binario para macOS Monterey o superior |

            > ✨ **Nota para Windows**: El ejecutable para Windows ya viene con todo el núcleo integrado. Solo haz doble clic y comenzará a funcionar inmediatamente.
